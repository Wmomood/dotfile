"Note" = "kitty helix Documents/momo/note.md"


"Games" = "pypr menu Games"


"tmux" = "kitty tmux"

"tmux momo" = "kitty tmux a -t momo &"

"tmux pi" = "kitty tmux a -t pi & "

"pyprland config" = "kitty h ~/.config/hypr/pyprland.toml"

"Reload pypr" = "pypr reload"

"Hyprland socket" = 'kitty  socat - "UNIX-CONNECT:$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock"'
"Hyprland logs" = 'kitty tail -f $XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/hyprland.log'

