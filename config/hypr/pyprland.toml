[pyprland]

plugins = [
  "scratchpads",
  "magnify",
  "workspaces_follow_focus",
  "layout_center",
  "shortcuts_menu",
  "fetch_client_menu",
]

[scratchpads.term]
animation = "fromTop"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
size = "75% 60%"

[scratchpads.volume]
animation = "fromTop"
command = "pavucontrol"
class = "org.pulseaudio.pavucontrol"
size = "75% 60%"
unfocus = "hide"
# hysteresis = 0.3
lazy = true


[layout_center]
margin = 60
offset = [0, 30]
next = "movefocus r"
prev = "movefocus l"
next2 = "movefocus d"
prev2 = "movefocus u"
# style = ["opacity 0.96", ""]
style = ["opacity 1"]


[shortcuts_menu.entries]
# "Open Main" = "pypr menu Main"
# "Open Games" = "pypr menu Games"
"Reload pypr" = "pypr reload"



[shortcuts_menu.entries."Main"]

# "Open Jira ticket" = 'open-jira-ticket "$(wl-paste)"'
# Relayout = "pypr relayout"

# "Serial USB Term" = [
