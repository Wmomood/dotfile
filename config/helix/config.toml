theme = "trans"
# theme = "tokyonight"

[editor]
line-number = "relative"
bufferline = "multiple"
# bufferline = "always"
auto-format = true

[editor.cursor-shape]
insert = "bar"
# select = "underline"

[keys.normal]
";" = "command_mode"
"：" = "command_mode"
esc = ["collapse_selection", "keep_primary_selection"]
# C-s = [":w!"]
C-r = [":reload-all"]
C-q = [":buffer-close"]

A-m = ":lsp-workspace-command Open Preview"

C-right = "move_next_word_start"
C-left = "move_prev_word_end"
C-S-right = "extend_next_word_end"
C-S-left = "extend_prev_word_start"
S-right = "extend_char_right"
S-left = "extend_char_left"

A-s = "save_selection"
A-w = ":buffer-close"
# delete to end of line
# D = ["select_mode", "goto_line_end", "change_selection"]

C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-down = ["extend_to_line_bounds", "delete_selection", "paste_after"]
A-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-k = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]
A-up = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]

A-k = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]

S-A-j = [
  "extend_to_line_bounds",
  "yank",
  "open_below",
  "normal_mode",
  "replace_with_yanked",
  "collapse_selection",
]
S-A-k = [
  "extend_to_line_bounds",
  "yank",
  "open_above",
  "normal_mode",
  "replace_with_yanked",
  "collapse_selection",
]
S-space = ["half_page_up"]
# Enhance Smart Tab
tab = "move_parent_node_end"
S-tab = "move_parent_node_start"


[keys.insert]
C-right = "move_next_word_start"
C-left = "move_prev_word_end"
A-i = "normal_mode"
# C-s = [":w!", "normal_mode"]

S-A-j = [
  "normal_mode",
  "extend_to_line_bounds",
  "yank",
  "open_below",
  "replace_with_yanked",
  "collapse_selection",
]
S-A-k = [
  "normal_mode",
  "extend_to_line_bounds",
  "yank",
  "open_above",
  "replace_with_yanked",
  "collapse_selection",
]
# Enhance Smart Tab
S-tab = "move_parent_node_start"

"A-h" = "move_char_left"
"A-l" = "move_char_right"
"A-j" = "move_line_down"
"A-k" = "move_line_up"

"A-L" = "extend_next_word_end"
"A-H" = "extend_prev_word_start"

S-right = ["normal_mode", "extend_char_right"]
S-left = ["normal_mode", "extend_char_left"]

"A-o" = "delete_char_backward"
"A-u" = "undo"
"A-y" = ["yank", "normal_mode"]

[keys.select]
# Enhance Smart Tab
tab = "extend_parent_node_end"
S-tab = "extend_parent_node_start"


[editor.statusline]
left = [
  "mode",
  "version-control",
  "file-modification-indicator",
  "read-only-indicator",
]
center = ["file-name"]
right = [
  "spinner",
  "diagnostics",
  "workspace-diagnostics",
  "position",
  "register",
  "selections",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
separator = "│"


[editor.lsp]
enable = true
display-progress-messages = true
auto-signature-help = true
display-inlay-hints = true
snippets = true


[editor.search]
smart-case = true
wrap-around = true


[editor.whitespace.render]
space = "none"
tab = "none"
nbsp = "all"
nnbsp = "all"
newline = "none"


[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
newline = "⏎"
tabpad = "·"  # Tabs will look like "→···" (depending on tab width)


[editor.indent-guides]
render = true
character = "▏" # "┊", "┆" "⸽" "╎"
skip-levels = 1

[editor.gutters]
layout = ["diff", "line-numbers", "diagnostics"]

[editor.gutters.line-numbers]
min-width = 1

[editor.soft-wrap]
enable = true
max-wrap = 30
max-indent-retain = 8
# wrap-at-text-width = true

[editor.smart-tab]
enable = true
supersede-menu = true

[editor.inline-diagnostics]
cursor-line = "info"
other-lines = "hint"
max-wrap = 30
max-diagnostics = 9
